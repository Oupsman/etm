etm_oidc_client_secret: "{{ vault_etm_oidc_client_secret }}"

etm_allowed_origin: "*"
etm_vapid_subscriber: "mailto:admin@example.com"

etm_oidc_enabled: "false"
etm_oidc_issuer_url: ""
etm_oidc_client_id: ""
etm_oidc_redirect_url: ""

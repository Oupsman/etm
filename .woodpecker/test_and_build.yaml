---
when:
  branch: main
  event: push
steps:
  - name: test-backend
    image: golang:1.25
    commands:
      - go test ./...
  - name: test-frontend
    image: node:22
    commands:
      - cd yaftm
      - npm install --ignore-scripts
      - npm run type-check
  - name: build-push
    image: woodpeckerci/plugin-docker-buildx
    depends_on: [test-backend, test-frontend]
    settings:
      registry:
        from_secret: registry_url
      repo:
        from_secret: registry_repo
      tags:
        - latest
        - ${CI_COMMIT_SHA}
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
  - name: deploy
    image: appleboy/drone-ssh
    depends_on: [build-push]
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      key:
        from_secret: deploy_ssh_key
      envs:
        - HOST
        - PORT
        - DB_HOST
        - DB_PORT
        - DATABASE
        - DB_USERNAME
        - DB_PASSWORD
        - SECRET_KEY
        - ALLOWED_ORIGIN
        - VAPID_SUBSCRIBER
        - OIDC_ENABLED
        - OIDC_ISSUER_URL
        - OIDC_CLIENT_ID
        - OIDC_CLIENT_SECRET
        - OIDC_REDIRECT_URL
      script:
        - env
        - sudo docker stop etmint || true
        - sudo docker rm etmint || true
        - sudo docker pull registry.oupsman.fr/oupsman/etm:${CI_COMMIT_SHA}
        - |
          sudo docker run -d \
            --name etm \
            --restart unless-stopped \
            -p ${PORT}:${PORT} \
            -e HOST=${HOST} \
            -e PORT=${PORT} \
            -e DB_HOST=${DB_HOST} \
            -e DB_PORT=${DB_PORT} \
            -e DATABASE=${DATABASE} \
            -e DB_USERNAME=${DB_USERNAME} \
            -e DB_PASSWORD=${DB_PASSWORD} \
            -e SECRET_KEY=${SECRET_KEY} \
            -e ALLOWED_ORIGIN=${ALLOWED_ORIGIN} \
            -e VAPID_SUBSCRIBER=${VAPID_SUBSCRIBER} \
            -e OIDC_ENABLED=${OIDC_ENABLED} \
            -e OIDC_ISSUER_URL=${OIDC_ISSUER_URL} \
            -e OIDC_CLIENT_ID=${OIDC_CLIENT_ID} \
            -e OIDC_CLIENT_SECRET=${OIDC_SECRET} \
            -e OIDC_REDIRECT_URL=${OIDC_REDIRECT_URL} \
            registry.oupsman.fr/oupsman/etm:${CI_COMMIT_SHA}
        - sudo docker image prune -f
    secrets:
      - source: host
        target: HOST
      - source: port
        target: PORT
      - source: db_host
        target: DB_HOST
      - source: db_port
        target: DB_PORT
      - source: database
        target: DATABASE
      - source: db_username
        target: DB_USERNAME
      - source: db_password
        target: DB_PASSWORD
      - source: secret_key
        target: SECRET_KEY
      - source: allowed_origin
        target: ALLOWED_ORIGIN
      - source: vapid_subscriber
        target: VAPID_SUBSCRIBER
      - source: oidc_enabled
        target: OIDC_ENABLED
      - source: oidc_issuer_url
        target: OIDC_ISSUER_URL
      - source: oidc_client_id
        target: OIDC_CLIENT_ID
      - source: oidc_client_secret
        target: OIDC_CLIENT_SECRET
      - source: oidc_redirect_url
        target: OIDC_REDIRECT_URL
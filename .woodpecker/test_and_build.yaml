---
when:
  branch: main
  event: push
steps:
  - name: test-backend
    image: golang:1.25
    commands:
      - go test ./...
  - name: test-frontend
    image: node:22
    commands:
      - cd yaftm
      - npm install --ignore-scripts
      - npm run type-check
  - name: build-push
    image: woodpeckerci/plugin-docker-buildx
    depends_on: [test-backend, test-frontend]
    settings:
      registry:
        from_secret: registry_url
      repo:
        from_secret: registry_repo
      tags:
        - latest
        - ${CI_COMMIT_SHA}
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
  - name: generate-env
    image: alpine
    environment:
      HOST:
        from_secret: host
      PORT:
        from_secret: port
      DB_HOST:
        from_secret: db_host
      DB_PORT:
        from_secret: db_port
      DATABASE:
        from_secret: database
      DB_USERNAME:
        from_secret: db_username
      DB_PASSWORD:
        from_secret: db_password
      SECRET_KEY:
        from_secret: secret_key
      ALLOWED_ORIGIN:
        from_secret: allowed_origin
      VAPID_SUBSCRIBER:
        from_secret: vapid_subscriber
      OIDC_ENABLED:
        from_secret: oidc_enabled
      OIDC_ISSUER_URL:
        from_secret: oidc_issuer_url
      OIDC_CLIENT_ID:
        from_secret: oidc_client_id
      OIDC_CLIENT_SECRET:
        from_secret: oidc_client_secret
      OIDC_REDIRECT_URL:
        from_secret: oidc_redirect_url
    commands:
      - echo "HOST=$HOST" > /woodpecker/src/etm.env
      - echo "PORT=$PORT" >> /woodpecker/src/etm.env
      - echo "DB_HOST=$DB_HOST" >> /woodpecker/src/etm.env
      - echo "DB_PORT=$DB_PORT" >> /woodpecker/src/etm.env
      - echo "DATABASE=$DATABASE" >> /woodpecker/src/etm.env
      - echo "DB_USERNAME=$DB_USERNAME" >> /woodpecker/src/etm.env
      - echo "DB_PASSWORD=$DB_PASSWORD" >> /woodpecker/src/etm.env
      - echo "SECRET_KEY=$SECRET_KEY" >> /woodpecker/src/etm.env
      - echo "ALLOWED_ORIGIN=$ALLOWED_ORIGIN" >> /woodpecker/src/etm.env
      - echo "VAPID_SUBSCRIBER=$VAPID_SUBSCRIBER" >> /woodpecker/src/etm.env
      - echo "OIDC_ENABLED=$OIDC_ENABLED" >> /woodpecker/src/etm.env
      - echo "OIDC_ISSUER_URL=$OIDC_ISSUER_URL" >> /woodpecker/src/etm.env
      - echo "OIDC_CLIENT_ID=$OIDC_CLIENT_ID" >> /woodpecker/src/etm.env
      - echo "OIDC_CLIENT_SECRET=$OIDC_CLIENT_SECRET" >> /woodpecker/src/etm.env
      - echo "OIDC_REDIRECT_URL=$OIDC_REDIRECT_URL" >> /woodpecker/src/etm.env
      - cat /woodpecker/src/etm.env  # debug
  - name: copy-env
    image: appleboy/drone-scp
    depends_on: [generate-env]
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      key:
        from_secret: deploy_ssh_key
      debug: true
      source: /woodpecker/src/etm.env
      target: /home/ansible/etm/etm.env
      strip_components: 0
  - name: deploy
    image: appleboy/drone-ssh
    depends_on: [copy-env]
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      key:
        from_secret: deploy_ssh_key
      script:
        - sudo docker stop etm || true
        - sudo docker rm etm || true
        - sudo docker pull registry.oupsman.fr/oupsman/etm:${CI_COMMIT_SHA}
        - sudo docker run -d --name etm --restart unless-stopped --env-file ~/etm/etm.env registry.oupsman.fr/oupsman/etm:${CI_COMMIT_SHA}
        - sudo docker image prune -f
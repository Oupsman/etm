---
when:
  branch: main
  event: push

services:
  - name: postgres
    image: postgres:16
    environment:
      POSTGRES_DB: etm
      POSTGRES_USER: etm
      POSTGRES_PASSWORD: testpass

steps:
  - name: test-backend
    image: golang:1.25
    commands:
      - go test ./...

  - name: test-frontend
    image: node:22
    commands:
      - cd yaftm
      - npm install --ignore-scripts
      - npm run type-check

  - name: lint-frontend
    image: node:22
    depends_on: [test-frontend]
    commands:
      - cd yaftm
      - npm run lint

  - name: build-binary
    image: golang:1.25
    depends_on: [test-backend]
    commands:
      - CGO_ENABLED=0 go build -o etm ./cmd/etm/main.go

  - name: zap-scan
    image: ghcr.io/zaproxy/zaproxy:stable
    depends_on: [build-binary]
    environment:
      HOST: ""
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DATABASE: etm
      DB_USERNAME: etm
      DB_PASSWORD: testpass
      SECRET_KEY: ci-zap-scan-secret-not-for-production
      ALLOWED_ORIGIN: "*"
    commands:
      - $CI_WORKSPACE/etm &
      - timeout 60 sh -c 'until curl -sf http://localhost:8080/api/v1/healthcheck; do sleep 2; done'
      - zap-baseline.py -t http://localhost:8080 -I -r /tmp/zap-report.html

  - name: build-push
    image: woodpeckerci/plugin-docker-buildx
    depends_on: [test-backend, test-frontend, lint-frontend, zap-scan]
    settings:
      registry:
        from_secret: registry_url
      repo:
        from_secret: registry_repo
      tags:
        - latest
        - ${CI_COMMIT_SHA}
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password

  - name: generate-scripts
    image: alpine
    depends_on: [build-push]
    environment:
      HOST:
        from_secret: host
      PORT:
        from_secret: port
      DB_HOST:
        from_secret: db_host
      DB_PORT:
        from_secret: db_port
      DATABASE:
        from_secret: database
      DB_USERNAME:
        from_secret: db_username
      DB_PASSWORD:
        from_secret: db_password
      SECRET_KEY:
        from_secret: secret_key
      ALLOWED_ORIGIN:
        from_secret: allowed_origin
      VAPID_SUBSCRIBER:
        from_secret: vapid_subscriber
      ENCRYPTION_KEY:
        from_secret: encryption_key
      OIDC_ENABLED:
        from_secret: oidc_enabled
      OIDC_ISSUER_URL:
        from_secret: oidc_issuer_url
      OIDC_CLIENT_ID:
        from_secret: oidc_client_id
      OIDC_CLIENT_SECRET:
        from_secret: oidc_client_secret
      OIDC_REDIRECT_URL:
        from_secret: oidc_redirect_url
    commands:
      # Génération du .env
      - echo "HOST=$HOST" > /woodpecker/src/etm.env
      - echo "PORT=$PORT" >> /woodpecker/src/etm.env
      - echo "DB_HOST=$DB_HOST" >> /woodpecker/src/etm.env
      - echo "DB_PORT=$DB_PORT" >> /woodpecker/src/etm.env
      - echo "DATABASE=$DATABASE" >> /woodpecker/src/etm.env
      - echo "DB_USERNAME=$DB_USERNAME" >> /woodpecker/src/etm.env
      - echo "DB_PASSWORD=$DB_PASSWORD" >> /woodpecker/src/etm.env
      - echo "SECRET_KEY=$SECRET_KEY" >> /woodpecker/src/etm.env
      - echo "ALLOWED_ORIGIN=$ALLOWED_ORIGIN" >> /woodpecker/src/etm.env
      - echo "VAPID_SUBSCRIBER=$VAPID_SUBSCRIBER" >> /woodpecker/src/etm.env
      - echo "ENCRYPTION_KEY=$ENCRYPTION_KEY" >> /woodpecker/src/etm.env
      - echo "OIDC_ENABLED=$OIDC_ENABLED" >> /woodpecker/src/etm.env
      - echo "OIDC_ISSUER_URL=$OIDC_ISSUER_URL" >> /woodpecker/src/etm.env
      - echo "OIDC_CLIENT_ID=$OIDC_CLIENT_ID" >> /woodpecker/src/etm.env
      - echo "OIDC_CLIENT_SECRET=$OIDC_CLIENT_SECRET" >> /woodpecker/src/etm.env
      - echo "OIDC_REDIRECT_URL=$OIDC_REDIRECT_URL" >> /woodpecker/src/etm.env
      # Génération du script de déploiement
      - echo "#!/bin/bash" > /woodpecker/src/deploy.sh
      - echo "set -e" >> /woodpecker/src/deploy.sh
      - echo "docker stop etm || true" >> /woodpecker/src/deploy.sh
      - echo "docker rm etm || true" >> /woodpecker/src/deploy.sh
      - echo "docker pull registry.oupsman.fr/oupsman/etm:${CI_COMMIT_SHA}" >> /woodpecker/src/deploy.sh
      - echo "docker run -d --name etm --restart unless-stopped --env-file /home/ansible/etm/etm.env -p $PORT:$PORT registry.oupsman.fr/oupsman/etm:${CI_COMMIT_SHA}" >> /woodpecker/src/deploy.sh
      - echo "docker image prune -f" >> /woodpecker/src/deploy.sh

  - name: copy-files
    image: appleboy/drone-scp
    depends_on: [generate-scripts]
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      key:
        from_secret: deploy_ssh_key
      source:
        - /woodpecker/src/etm.env
        - /woodpecker/src/deploy.sh
      target: /home/ansible/etm/
      strip_components: 2
      overwrite: true

  - name: deploy
    image: appleboy/drone-ssh
    depends_on: [copy-files]
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      key:
        from_secret: deploy_ssh_key
      script:
        - chmod +x /home/ansible/etm/deploy.sh
        - sudo /home/ansible/etm/deploy.sh

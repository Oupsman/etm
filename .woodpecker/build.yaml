when:
  branch: main
  event: push

steps:
  - name: test-backend
    image: golang:1.25
    commands:
      - go test ./...

  - name: test-frontend
    image: node:22
    commands:
      - cd yaftm
      - npm install --ignore-scripts
      - npm run type-check

  - name: build-push
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry:
        from_secret: registry_url
      repo:
        from_secret: registry_repo
      tags:
        - latest
        - ${CI_COMMIT_SHA}
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      key:
        from_secret: deploy_ssh_key
      script:
        # server must be pre-logged-in: docker login <your-registry>
        - docker pull <your-registry>/oupsman/etm:latest
        - docker compose -f ~/etm/docker-compose.yml up -d
